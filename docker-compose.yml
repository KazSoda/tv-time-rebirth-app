services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET manquant - copie .env.example en .env et renseigne-le}
      - PORT=8080
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
